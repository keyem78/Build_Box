body, body button, body input, body select, body textarea { font-family: "PM Roboto", system-ui, "Segoe UI", Arial, sans-serif; }
#rtTree, #rtTree * { font-family: "PM Roboto Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }

#sideRz:hover, #sideRz.drag { background: rgba(241, 162, 58, 0.35) !important; }

#treeBody { padding: 10px 12px; box-sizing: border-box; cursor: grab; flex: 1 1 auto; min-height: 0px; overflow: auto !important; width: auto !important; height: auto !important; display: block !important; }
#treeWin.min #treeBody { display: none !important; }
#testBody { flex: 1 1 auto; min-height: 0px; width: auto !important; height: auto !important; }
#treeBody.drag { cursor: grabbing; }
#rtTree { display: inline-block; min-width: 100%; flex: 0 0 auto; font: 12px / 1.2 "PM Roboto Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; }
.rt-row { display: flex; align-items: flex-start; position: relative; }
.rt-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 0 0 auto; }
.rt-n { display: inline-flex; align-items: flex-start; gap: 6px; min-height: 28px; box-sizing: border-box; padding: 5px 8px; border: 1px solid var(--cc); background: var(--cb); color: var(--ct); border-radius: 6px; cursor: pointer; user-select: none; flex: 0 0 auto; }
.rt-n .tx { display: flex; flex-direction: column; gap: 2px; max-width: 140px; min-width: 0px; white-space: normal; overflow-wrap: anywhere; padding-top: 2px; }
.rt-n .tx .sub { color: var(--cl); opacity: 0.8; font-size: 11px; }
.rt-n .tx input, .rt-n .tx select { width: 140px; max-width: 140px; }
.rt-n .tx input[type="number"] { width: 70px; }
.rt-n.root { border-width: 2px; font-weight: 700; color: var(--cl); text-transform: uppercase; letter-spacing: 0.04em; }
.rt-n.root .sub { text-transform: none; letter-spacing: 0px; font-weight: 400; }
.rt-n.cat { font-weight: 700; color: var(--cl); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px; }
.rt-n.leaf { cursor: default; }
.rt-n.link { cursor: pointer; }
.rt-n.link .tx > span:first-child { text-decoration: underline dotted; }
.rt-n .ic { display: inline-flex; color: var(--cl); padding-top: 2px; }
.rt-n .car { color: var(--cl); font-size: 9px; width: 8px; text-align: center; padding-top: 5px; }
.rt-n canvas { width: 20px; height: 20px; image-rendering: pixelated; border-radius: 3px; background: rgba(0, 0, 0, 0.25); flex: 0 0 auto; }
.rt-n input, .rt-n select { height: 20px; box-sizing: border-box; font: 12px "PM Roboto Condensed", "Roboto Condensed", system-ui, sans-serif; background: rgba(0, 0, 0, 0.35); color: var(--ct); border: 1px solid var(--cc); border-radius: 4px; padding: 0px 4px; }
.rt-n .btns { display: inline-flex; gap: 4px; flex: 0 0 auto; }
.rt-n button.act { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 18px; padding: 0px; margin: 0px; background: transparent; border: 1px solid var(--cc); border-radius: 5px; color: var(--cl); cursor: pointer; }
.rt-n button.act:hover { background: var(--cc); color: var(--cb); }
.rt-kids { display: none; flex-direction: column; gap: 6px; margin-left: 14px; position: relative; }
.rt-kids.on { display: flex; }
.rt-kids::before { content: ""; position: absolute; left: -14px; top: 14px; width: 14px; border-top: 1px solid var(--lc); }
.rt-kids > .rt-row { padding-left: 14px; }
.rt-kids > .rt-row::before { content: ""; position: absolute; left: 0px; top: 14px; width: 14px; border-top: 1px solid var(--lc); }
.rt-kids > .rt-row::after { content: ""; position: absolute; left: 0px; top: 0px; bottom: -6px; border-left: 1px solid var(--lc); }
.rt-kids > .rt-row:first-child::after { top: 14px; }
.rt-kids > .rt-row:last-child::after { bottom: auto; height: 14px; }
.rt-kids > .rt-row:only-child::after { display: none; }
.rt-prev { width: 96px; height: 96px; box-sizing: border-box; border: 1px solid rgb(95, 179, 217); border-radius: 8px; background: repeating-conic-gradient(rgb(28, 36, 48) 0deg, rgb(28, 36, 48) 25%, rgb(35, 45, 59) 0deg, rgb(35, 45, 59) 50%) 0px 0px / 16px 16px; display: flex; align-items: center; justify-content: center; }
.rt-prev canvas { width: 88px; height: 88px; image-rendering: pixelated; }
.rt-empty { color: rgb(159, 176, 200); font: 11px system-ui, sans-serif; padding: 6px 2px; white-space: nowrap; }

#lyBar { position: absolute; left: 8px; top: 8px; z-index: 5; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: calc(100% - 16px); padding: 4px; border: 1px solid rgb(159, 196, 47); border-radius: 10px; background: rgba(23, 27, 36, 0.9); font: 11px / 1 system-ui, sans-serif; user-select: none; touch-action: manipulation; }
#lyBar button { height: 22px; padding: 0px 8px; border-radius: 6px; border: 1px solid rgb(85, 95, 115); background: rgb(29, 34, 44); color: rgb(154, 166, 184); cursor: pointer; white-space: nowrap; font: inherit; display: inline-flex; align-items: center; gap: 4px; }
#lyBar button.on { border-color: rgb(159, 196, 47); background: rgb(37, 48, 15); color: rgb(217, 245, 140); }
#lyBar button.off { text-decoration: line-through; opacity: 0.6; }
#lyBar button.act { border-color: rgb(255, 216, 74); box-shadow: rgb(255, 216, 74) 0px 0px 0px 1px inset; }
#lyBar button.mode { border-color: rgb(159, 196, 47); color: rgb(198, 232, 58); background: transparent; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px; }
#lyBar .sep { width: 1px; height: 16px; background: rgb(159, 196, 47); opacity: 0.6; margin: 0px 2px; }
#lyBar .k { opacity: 0.55; font-size: 9px; }
body.playing #lyBar { display: none; }

#tgL { display: none !important; }
#toolIcons > button[title^="Pennello più"] { display: none !important; }
#pmBub { grid-area: span 1 / span 2; height: 38px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 0px 3px; border: 1px solid rgb(159, 196, 47); border-radius: 10px; background: rgb(29, 34, 44); color: rgb(217, 245, 140); font: 700 13px "PM Roboto", system-ui, sans-serif; user-select: none; align-self: start; }
#pmBub button { width: 26px; height: 26px; padding: 0px; margin: 0px; border: 0px; border-radius: 7px; background: transparent; color: rgb(198, 232, 58); font: 700 16px / 1 "PM Roboto", system-ui, sans-serif; cursor: pointer; flex: 0 0 auto; }
#pmBub button:hover { background: rgba(198, 232, 58, 0.16); }
#pmBub button:disabled { opacity: 0.3; cursor: default; }
#pmBub .v { min-width: 18px; text-align: center; flex: 0 0 auto; }
#pmBub.vert { grid-area: span 3 / span 1; width: 38px; height: auto; flex-direction: column; justify-content: space-between; padding: 4px 0px; align-self: stretch; }
#pmBub.vert button { width: 30px; height: 30px; }

#toolHead, #toolClose { display: none !important; }
#toolWin { padding-top: 0px !important; }
#toolBody { cursor: move; touch-action: none; }
#toolBody button { cursor: pointer; }
#toolWin .frz { z-index: 3; }

#bar .lineBreak { flex-basis: 100%; height: 0px; order: 1; margin: 0px; padding: 0px; border: 0px; }
#bar #grpLayers { order: 2; margin-right: 6px; }
#bar #lyBar { position: static; order: 3; max-width: none; margin: 0px; border-radius: 10px; justify-content: flex-start; flex: 1 1 auto; }
#bar { row-gap: 4px; }

#menuBar { display: flex; align-items: center; gap: 2px; height: 26px; padding: 0px 6px; background: rgb(13, 17, 23); border-bottom: 1px solid rgb(42, 49, 64); font: 13px "PM Roboto", system-ui, sans-serif; color: rgb(214, 221, 232); position: relative; z-index: 50; user-select: none; }

function newDoc(w,h,fill){ const d={w,h,layers:[],active:0}; addLayerTo(d,'Sfondo',fill||null); return d; }
function addLayerTo(d,name,fill){
  const c = mkC(d.w,d.h);
  if (fill){ const x=c.getContext('2d'); x.fillStyle=fill; x.fillRect(0,0,c.width,c.height); }
  const L = { id:LID++, name:name||('Livello '+(d.layers.length+1)), visible:true, locked:false, opacity:1, blend:'source-over', c, fx:fxDefault() };

let PALETTE=null; /* palette corrente: colori estratti dall'immagine (se presente) */
/* median cut pesato: ogni colore è una scatola; si dividono le scatole più popolate e più ampie */
function paletteFromImage(data,W,H,n){ const step=Math.max(1,Math.floor(Math.sqrt(W*H/20000))); const pts=[];
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step){ const i=(y*W+x)*4; if(data[i+3]<128) continue; pts.push([data[i],data[i+1],data[i+2]]); }
  if(!pts.length) return PALETTE0.slice(0,n);
  const rng=b=>{ let best={ch:0,max:-1}; for(let ch=0;ch<3;ch++){ let mn=255,mx=0; for(const p of b){ if(p[ch]<mn)mn=p[ch]; if(p[ch]>mx)mx=p[ch]; } if(mx-mn>best.max) best={ch,max:mx-mn}; } return best; };
  let boxes=[pts];
  while(boxes.length<n){ let bi=-1,best=-1; boxes.forEach((b,i)=>{ if(b.length<2) return; const r=rng(b); const sc=b.length*Math.max(1,r.max); if(sc>best){best=sc;bi=i;} });
    if(bi<0) break; const b=boxes[bi],r=rng(b); b.sort((u,v)=>u[r.ch]-v[r.ch]); const m=b.length>>1; boxes.splice(bi,1,b.slice(0,m),b.slice(m)); }
  const cols=boxes.map(b=>{ const s=[0,0,0]; for(const p of b){ s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; } return rgbToHex(s[0]/b.length,s[1]/b.length,s[2]/b.length); });
  const hsl=h=>{ const [r,g,b]=hexToRgb(h).map(v=>v/255); const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2; let hu=0; if(mx!==mn){ const d=mx-mn; hu=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; hu*=60; if(hu<0)hu+=360; } return [hu,l]; };
  return cols.sort((a,b)=>{ const A=hsl(a),B=hsl(b); return Math.floor(A[0]/30)-Math.floor(B[0]/30) || A[1]-B[1]; });
}
let palN=64;
function setPaletteFromDoc(){ if(!S.doc) return; const c=flatten(),d=c.getContext('2d').getImageData(0,0,c.width,c.height).data; PALETTE=paletteFromImage(d,c.width,c.height,palN); renderPalette(); }
function renderPalette(){ const p=$('palette'); if(!p) return; const list=PALETTE||PALETTE0; p.innerHTML=list.map(c=>'<div style="background:'+c+'" title="'+c+'" data-c="'+c+'"></div>').join('');
  for(const d of p.children){ d.onclick=e=>{ if(e.altKey) setBg(d.dataset.c); else setFg(d.dataset.c); }; d.oncontextmenu=e=>{ e.preventDefault(); setBg(d.dataset.c); }; d.ondblclick=()=>{ const i=[...p.children].indexOf(d); openColorPicker(d.dataset.c,hex=>{ if(!PALETTE) PALETTE=PALETTE0.slice(); PALETTE[i]=hex; renderPalette(); setFg(hex); }); }; } }
document.addEventListener('click',e=>{ const el=e.target; if(el&&el.matches&&el.matches('input[type=color]')){ e.preventDefault(); openColorPicker(el.value,hex=>{ el.value=hex; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); }); } },true);
function hexToRgb(h){ h=(h||'#000000').replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16)||0; return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbaOf(hex,a){ const [r,g,b]=hexToRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }

function resetHistory(){ S.undo=[]; S.redo=[]; S.dropped=0; S.origin=snapDoc(); }
function beginPx(L){ S.pending={t:'px',id:L.id,img:ctxOf(L).getImageData(0,0,L.c.width,L.c.height)}; }
function toolLabel(){ const T=TOOLS.find(x=>x.id===S.tool); return T?T.name:'Disegno'; }
function commitPx(){ if(S.pending){ restoreOutside(S.pending,true); pushUndo(S.pending,toolLabel()); S.pending=null; } S.freeDraw=false; }
/* la selezione limita le modifiche: fuori dalla maschera il livello torna al valore precedente */
function restoreOutside(before,partial){ if(S.freeDraw||!S.selMask||!S.doc||!before||!before.img) return; const L=AL(); if(!L||L.id!==before.id) return;
  const W=L.c.width,H=L.c.height,c=ctxOf(L),cur=c.getImageData(0,0,W,H),d=cur.data,o=before.img.data,m=S.selMask.data;
  for(let i=0;i<W*H;i++){ const a=m[i*4+3]/255; if(a<1){ const k=i*4; if(a<=0){ d[k]=o[k]; d[k+1]=o[k+1]; d[k+2]=o[k+2]; d[k+3]=o[k+3]; } else if(partial){ d[k]=Math.round(o[k]*(1-a)+d[k]*a); d[k+1]=Math.round(o[k+1]*(1-a)+d[k+1]*a); d[k+2]=Math.round(o[k+2]*(1-a)+d[k+2]*a); d[k+3]=Math.round(o[k+3]*(1-a)+d[k+3]*a); } } }
  c.putImageData(cur,0,0); }

function fxDefault(){ return {order:null,fxOff:null,shadow:{on:false,mode:'multiply',pos:'outer',color:'#000000',op:75,angle:120,dist:5,size:5},glow:{on:false,mode:'screen',pos:'outer',color:'#c6e83a',op:75,size:10},stroke:{on:false,mode:'source-over',pos:'outer',color:'#ffffff',op:100,size:3},pattern:{on:false,mode:'source-over',op:100,motif:'dots',scale:100,color:'#000000'},colorfill:{on:false,mode:'source-over',op:100,color:'#c6e83a'},bevel:{on:false,hmode:'screen',smode:'multiply',pos:'inner',op:75,depth:100,size:5,hard:50,angle:120,alt:30,hl:'#ffffff',sh:'#000000'},gradient:{on:false,mode:'source-over',op:100,type:'linear',angle:90,scale:100,stops:{c:[{p:0,c:'#c6e83a'},{p:1,c:'#1f2531'}],o:[{p:0,a:1},{p:1,a:1}]}}}; }
function fxOf(L){ if(!L.fx) L.fx=fxDefault(); const d=fxDefault(); for(const k in d) if(!L.fx[k]) L.fx[k]=d[k]; const g=L.fx.gradient; if(g&&!g.stops) g.stops={c:[{p:0,c:g.c1||'#c6e83a'},{p:1,c:g.c2||'#1f2531'}],o:[{p:0,a:1},{p:1,a:1}]}; return L.fx; }
function fxStops(G){ const cs=G.stops.c, os=G.stops.o; const ps=[...new Set([0,1,...cs.map(s=>s.p),...os.map(s=>s.p)].map(p=>Math.min(1,Math.max(0,p))))].sort((a,b)=>a-b); return ps.map(p=>({p,col:rgbaOf(colAt(cs,p),opAt(os,p))})); }
function fxCopy(){ const L=AL(); if(!L) return; S.fxClip=JSON.parse(JSON.stringify(fxOf(L))); S.fxClip.fxOff=null; status('Effetti copiati'); }

function applyText(x,y,txt,size,font,st){
  const lines=String(txt).split('\n');
  if(!lines.some(l=>l.trim())) return;
  const name=(lines.find(l=>l.trim())||'Testo').trim().slice(0,24);
  layerOp(()=>{ const L=addLayerTo(S.doc,name,null), c=ctxOf(L); c.save(); clipSel(c);
    c.font=(st.i?'italic ':'')+(st.b?'bold ':'')+size+'px '+(TXT_FAM[font]||TXT_FAM.sans);
    c.fillStyle=S.fg; c.textBaseline='top'; c.textAlign=st.al||'left';

      const x0=c.textAlign==='center'? x-w/2 : c.textAlign==='right'? x-w : x;

    else if(d.tool==='clone'){ D[i]=o0+(S2[i]-o0)*f; D[i+1]=o1+(S2[i+1]-o1)*f; D[i+2]=o2+(S2[i+2]-o2)*f; D[i+3]=D[i+3]+(S2[i+3]-D[i+3])*f; }

function boxHF(src,dst,w,h,r){ const n=2*r+1; for(let y=0;y<h;y++){ const row=y*w*4; for(let k=0;k<4;k++){ let sum=0; for(let x=-r;x<=r;x++) sum+=src[row+clamp(x,0,w-1)*4+k]; for(let x=0;x<w;x++){ dst[row+x*4+k]=sum/n; sum+=src[row+clamp(x+r+1,0,w-1)*4+k]-src[row+clamp(x-r,0,w-1)*4+k]; } } } }
function boxVF(src,dst,w,h,r){ const n=2*r+1, W4=w*4, S=new Float64Array(W4);

  for(let y=0;y<h;y++){ const ro=y*W4; for(let i=0;i<W4;i++) dst[ro+i]=S[i]/n;

/* ---------- finestra di dialogo (stile .ndlg di Build Box) ---------- */
function openDialog(o){
  const m=$('ndlg'),box=$('ndlgBox'); box.innerHTML='';
  const h=document.createElement('h2'); h.textContent=o.title; box.appendChild(h);
  const vals={},inputs=[];
  for(const f of (o.fields||[])){
    vals[f.k]=f.val; const row=document.createElement('div'); row.className='f'; const lab=document.createElement('span'); lab.textContent=f.label; row.appendChild(lab); let el;
    if(f.type==='range'){ el=document.createElement('input'); el.type='range'; el.min=f.min; el.max=f.max; el.step=f.step||1; el.value=f.val; const v=document.createElement('span'); v.className='v'; v.textContent=f.val; el.oninput=()=>{ vals[f.k]=+el.value; v.textContent=el.value; live(); }; row.appendChild(el); row.appendChild(v); }
    else if(f.type==='number'){ el=document.createElement('input'); el.type='number'; el.min=f.min; el.max=f.max; el.value=f.val; el.style.width='110px'; el.oninput=()=>{ vals[f.k]=+el.value; }; row.appendChild(el); }
    else if(f.type==='select'){ el=document.createElement('select'); for(const [v,t] of f.options){ const op=document.createElement('option'); op.value=v; op.textContent=t; el.appendChild(op); } el.value=f.val; vals[f.k]=f.val; el.onchange=()=>{ vals[f.k]=el.value; live(); }; row.appendChild(el); }
    else if(f.type==='color'){ el=document.createElement('input'); el.type='color'; el.value=f.val; el.oninput=()=>{ vals[f.k]=el.value; live(); }; row.appendChild(el); }
    box.appendChild(row); inputs.push(el);
  }
  if(o.html){ const d=document.createElement('div'); d.innerHTML=o.html; box.appendChild(d); }
  if(o.note){ const n=document.createElement('div'); n.className='note'; n.textContent=o.note; box.appendChild(n); }
  const acts=document.createElement('div'); acts.className='acts';
  const cancel=document.createElement('button'); cancel.textContent=o.noCancel?'Chiudi':'Annulla';
  const ok=document.createElement('button'); ok.textContent=o.okLabel||'OK'; ok.className='pri';
  if(!o.noCancel||o.ok){ acts.appendChild(cancel); } else acts.appendChild(cancel);
  if(!o.noOk) acts.appendChild(ok);
  box.appendChild(acts);
  const close=()=>{ m.classList.remove('on'); document.removeEventListener('keydown',onKey,true); };
  const live=()=>{ if(o.live) o.live(vals); };
  const onKey=e=>{ if(e.key==='Escape'){ e.preventDefault(); cancel.click(); } else if(e.key==='Enter'&&!o.noOk&&document.activeElement&&document.activeElement.tagName!=='SELECT'){ e.preventDefault(); ok.click(); } };
  cancel.onclick=()=>{ close(); if(o.cancel) o.cancel(); };
  ok.onclick=()=>{ close(); if(o.ok) o.ok(vals); };
  m.onclick=e=>{ if(e.target===m) cancel.click(); };
  document.addEventListener('keydown',onKey,true); m.classList.add('on');
  setTimeout(()=>{ const f=inputs[0]; if(f&&f.focus) f.focus(); },30);
}

function liveAdjust(title,fields,fn,opts){

let adjPreviewPending=false;
function adjPreview(){ if(adjPreviewPending) return; adjPreviewPending=true; requestAnimationFrame(()=>{ if(!adjPreviewPending) return; adjPreviewPending=false; adjPreviewNow(); }); }
function adjPreviewNow(){ const A=S.adj; if(!A) return; const img=new ImageData(new Uint8ClampedArray(A.pre.data),A.r.w,A.r.h); A.fn(img.data,A.r.w,A.r.h,A.vals); A.c.putImageData(img,A.r.x,A.r.y); renderAll(); }
function adjClose(ok){ const A=S.adj; if(!A) return; if(adjPreviewPending){ adjPreviewPending=false; adjPreviewNow(); }

  else { A.c.putImageData(A.pre,A.r.x,A.r.y); renderAll(); }

function buildAdjWin(title,fields,opts){

/* ---------- tela, livelli ---------- */
function resizeDoc(nw,nh,anchor){ pushDocUndo('Dimensione tela'); const d=S.doc,ox=anchor==='tl'?0:anchor==='c'?Math.round((nw-d.w)/2):nw-d.w,oy=anchor==='tl'?0:anchor==='c'?Math.round((nh-d.h)/2):nh-d.h;
  for(const L of d.layers){ const c=mkC(nw,nh); c.getContext('2d').drawImage(L.c,ox,oy); L.c=c; } d.w=nw; d.h=nh; S.sel=null; afterChange(); fitView(); }
function cropToSelection(){
  if(!S.sel) return status('Crea prima una selezione con lo strumento Selezione rettangolare');
  const d=S.doc, x0=Math.max(0,Math.floor(S.sel.x)), y0=Math.max(0,Math.floor(S.sel.y));
  const x1=Math.min(d.w,Math.ceil(S.sel.x+S.sel.w)), y1=Math.min(d.h,Math.ceil(S.sel.y+S.sel.h));
  const w=x1-x0, h=y1-y0;
  if(w<1||h<1) return status('La selezione è fuori dalla tela');
  if(x0===0&&y0===0&&w===d.w&&h===d.h) return status('La selezione coincide già con la tela');
  pushDocUndo('Ritaglia alla selezione');
  for(const L of d.layers){ const c=mkC(w,h); c.getContext('2d').drawImage(L.c,-x0,-y0); L.c=c; }
  d.w=w; d.h=h; S.sel=null; S.selMask=null; afterChange(); fitView();
  status('Tela ritagliata a '+w+' × '+h+' px');
}
function scaleDoc(nw,nh,method){
  pushDocUndo('Dimensione immagine'); const d=S.doc;
  for(const L of d.layers){ const c=mkC(nw,nh), x=c.getContext('2d'); x.imageSmoothingEnabled=(method!=='nearest'); if(x.imageSmoothingQuality) x.imageSmoothingQuality='high'; x.drawImage(L.c,0,0,nw,nh); L.c=c; }
  d.w=nw; d.h=nh; S.sel=null; afterChange(); fitView();
  status('Immagine ridimensionata a '+nw+' × '+nh+' px');
}
function dlgScaleImage(){ openDialog({title:'Dimensione immagine',okLabel:'Applica',fields:[{k:'w',label:'Larghezza',type:'number',min:1,max:8000,val:S.doc.w},{k:'h',label:'Altezza',type:'number',min:1,max:8000,val:S.doc.h},{k:'m',label:'Metodo',type:'select',val:'nearest',options:[['nearest','Vicino più prossimo (pixel art)'],['smooth','Liscio (bilineare)']]}],
  ok:v=>scaleDoc(clamp(Math.round(+v.w),1,8000),clamp(Math.round(+v.h),1,8000),v.m)}); }
function transformDoc(kind){
  const names={cw:'Ruota tela 90° orario',ccw:'Ruota tela 90° antiorario',r180:'Ruota tela 180°',mh:'Specchia tela orizzontale',mv:'Specchia tela verticale'};
  pushDocUndo(names[kind]||'Trasforma tela'); const d=S.doc, W=d.w, H=d.h, rot=(kind==='cw'||kind==='ccw');
  const nw=rot?H:W, nh=rot?W:H;
  for(const L of d.layers){ const c=mkC(nw,nh), x=c.getContext('2d'); x.imageSmoothingEnabled=false; x.save();
    if(kind==='cw'){ x.translate(nw,0); x.rotate(Math.PI/2); }
    else if(kind==='ccw'){ x.translate(0,nh); x.rotate(-Math.PI/2); }
    else if(kind==='r180'){ x.translate(nw,nh); x.rotate(Math.PI); }
    else if(kind==='mh'){ x.translate(nw,0); x.scale(-1,1); }
    else if(kind==='mv'){ x.translate(0,nh); x.scale(1,-1); }
    x.drawImage(L.c,0,0); x.restore(); L.c=c; }
  d.w=nw; d.h=nh; S.sel=null; afterChange(); fitView();
  status(names[kind]+' · '+nw+' × '+nh+' px');
}
function layerOp(fn,name){ pushDocUndo(name); fn(); afterChange(); }
function newLayer(){ layerOp(()=>{ addLayerTo(S.doc,null,null); },'Nuovo livello'); status('Livello aggiunto'); }
/* nuovo livello con solo i pixel della selezione, nella stessa posizione; il livello originale resta com'è */
function layerFromSelection(){ if(!S.sel||!S.doc) return status('Crea prima una selezione'); const src=AL(); if(!src) return;
  const W=S.doc.w,H=S.doc.h, from=ctxOf(src).getImageData(0,0,W,H);
  layerOp(()=>{ const d=S.doc, c=mkC(W,H), x=c.getContext('2d'), img=x.createImageData(W,H);
    for(let y=S.sel.y;y<S.sel.y+S.sel.h;y++) for(let xx=S.sel.x;xx<S.sel.x+S.sel.w;xx++){ if(!inSel(xx,y)) continue; const k=(y*W+xx)*4; img.data[k]=from.data[k]; img.data[k+1]=from.data[k+1]; img.data[k+2]=from.data[k+2]; img.data[k+3]=from.data[k+3]; }
    x.putImageData(img,0,0);
    const n={ id:LID++, name:src.name+' selezione', visible:true, locked:false, opacity:src.opacity, blend:src.blend, c };
    d.layers.splice(d.active+1,0,n); d.active=d.layers.indexOf(n); },'Livello dalla selezione');
  status('Livello dalla selezione aggiunto'); }
function dupLayer(){ layerOp(()=>{ const d=S.doc,L=AL(),n={...L,fx:JSON.parse(JSON.stringify(fxOf(L))),id:LID++,name:L.name+' copia',c:cloneC(L.c)}; d.layers.splice(d.active+1,0,n); d.active=d.layers.indexOf(n); },'Duplica livello'); }
function delLayer(){ if(S.doc.layers.length<2) return status('Serve almeno un livello'); layerOp(()=>{ const d=S.doc; d.layers.splice(d.active,1); d.active=clamp(d.active,0,d.layers.length-1); },'Elimina livello'); }
function moveLayer(dir){ const d=S.doc,t=d.active+dir; if(t<0||t>=d.layers.length) return; layerOp(()=>{ const x=d.layers[d.active]; d.layers[d.active]=d.layers[t]; d.layers[t]=x; d.active=t; },'Sposta livello'); }
function mergeDown(){ const d=S.doc; if(d.active===0) return status('Non c’è un livello sotto'); layerOp(()=>{ const top=d.layers[d.active],bot=d.layers[d.active-1],c=ctxOf(bot); c.save(); c.globalAlpha=top.opacity; c.globalCompositeOperation=top.blend; c.drawImage(top.c,0,0); c.restore(); d.layers.splice(d.active,1); d.active=d.active-1; },'Unisci livelli'); status('Unito con il livello sotto'); }

/* ---------- appunti: taglia, copia, incolla ---------- */
function copySel(cut){
  const L=AL(); if(!L) return; if(cut&&L.locked) return status('Livello bloccato');
  const r=regionRect(),c=mkC(r.w,r.h); c.getContext('2d').drawImage(L.c,r.x,r.y,r.w,r.h,0,0,r.w,r.h); S.clip={c,x:r.x,y:r.y};
  if(cut){ pushPxUndo(L,()=>{ ctxOf(L).clearRect(r.x,r.y,r.w,r.h); }); afterChange(); }
  status(cut?'Tagliato':'Copiato');
}
function pasteClip(){
  if(!S.clip) return status('Appunti vuoti');
  layerOp(()=>{ const L=addLayerTo(S.doc,'Incollato',null); ctxOf(L).drawImage(S.clip.c,S.sel?S.sel.x:S.clip.x,S.sel?S.sel.y:S.clip.y); },'Incolla');
  setTool('move'); status('Incollato in un nuovo livello: trascinalo per posizionarlo');
}

/* ---------- colori ---------- */
function setFg(hex){ S.fg=hex; updateColors(); }
function setBg(hex){ S.bg=hex; updateColors(); }
function swapColors(){ const t=S.fg; S.fg=S.bg; S.bg=t; updateColors(); }
function resetColors(){ S.fg='#000000'; S.bg='#ffffff'; updateColors(); }
function updateColors(){ if(!$('fgSw')) return; $('fgSw').style.background=S.fg; $('bgSw').style.background=S.bg; $('fgIn').value=S.fg; $('bgIn').value=S.bg; $('hexIn').value=S.fg.toUpperCase(); renderAll(); }

function toolBtn(t,cls){ return '<button data-tool="'+t.id+'" title="'+t.name+' ('+t.key+')"'+(cls?' class="'+cls+'"':'')+'>'+ic(t.ic)+'</button>'; }
/* pillola zoom: 3 colonne in orizzontale; con meno di 3 colonne diventa verticale (+ / % / −) su 2 righe */
let zpLast=null, zpQueued=false;
function zoomPillLayout(){ const I=$('toolIcons'),p=$('zoomPill'); if(!I||!p) return; const cols=Math.floor((I.clientWidth+4)/42), vert=cols<3; if(vert===zpLast) return; zpLast=vert; p.classList.toggle('vert',vert); const W=$('toolWin'); if(W) W.classList.toggle('zvert',vert); }
/* il ResizeObserver non cambia il layout nello stesso frame: l'aggiornamento va al frame successivo */
function zoomPillQueue(){ if(zpQueued) return; zpQueued=true; requestAnimationFrame(()=>{ zpQueued=false; zoomPillLayout(); }); }
function buildTools(){
  let h='';
  for(let g=1;g<=4;g++){ if(g>1) h+='<hr>'; h+='<div class="tgrp g'+g+'">'+TOOLS.filter(t=>t.g===g).map(t=>toolBtn(t)).join('')+'</div>'; }
  let w='',last=0;
  const vb=(id,ico,tip)=>'<button id="'+id+'" title="'+tip+'" style="width:38px;height:38px;min-width:38px;max-width:38px;min-height:38px;max-height:38px;padding:0;box-sizing:border-box">'+ic(ico)+'</button>';
  const VIEWBTNS=vb('fitViewBtn','fit','Adatta alla finestra (vedi tutto il livello)')+vb('centerBtn','center','Centra la tela');

const NUDGE={t:0,entry:null,id:null};
function nudgeBlocked(){ if(window.__adjOpen) return true; for(const id of ['sbDlg','impDlg','pbGem','pbSearch','pbGuide','cpOv','gdOv','adjWin']){ if(document.getElementById(id)) return true; } const _wz=document.getElementById('wzWin'); if(_wz&&_wz.style.display!=='none'&&_wz.contains(document.activeElement)) return true; const nd=document.getElementById('ndlg'); return !!(nd&&getComputedStyle(nd).display!=='none'); }
function nudge(dx,dy){ const L=AL(); if(!L||!S.doc) return; if(L.locked){ status('Livello bloccato'); return; }
  const t=S.tool, W=S.doc.w, H=S.doc.h, now=performance.now();
  if(S.sel&&['select','ellsel','lasso','wand'].includes(t)){ shiftSelection(dx,dy); afterChange(); status('Selezione spostata di '+dx+', '+dy+' px'); return; }
  const same=!!(NUDGE.entry&&S.undo[S.undo.length-1]===NUDGE.entry&&NUDGE.id===L.id&&now-NUDGE.t<900); let ent=null;
  if(S.sel&&t!=='move'){ const inside=new Uint8Array(W*H); for(let y=S.sel.y;y<S.sel.y+S.sel.h;y++) for(let x=S.sel.x;x<S.sel.x+S.sel.w;x++){ if(x<0||y<0||x>=W||y>=H) continue; if(inSel(x,y)) inside[y*W+x]=1; }
    if(!same){ beginPx(L); ent=S.pending; } movePixels(L,{inside:inside,img:ctxOf(L).getImageData(0,0,W,H),dx:dx,dy:dy});
    if(!same){ pushUndo(ent,'Sposta selezione (frecce)'); S.pending=null; NUDGE.entry=ent; } shiftSelection(dx,dy); }
  else { if(!same){ beginPx(L); ent=S.pending; } const snap=cloneC(L.c), c=ctxOf(L); c.clearRect(0,0,L.c.width,L.c.height); c.drawImage(snap,dx,dy);
    if(!same){ pushUndo(ent,'Sposta livello (frecce)'); S.pending=null; NUDGE.entry=ent; } }
  NUDGE.t=now; NUDGE.id=L.id; afterChange(); status((S.sel&&t!=='move'?'Contenuto della selezione':'Livello')+' spostato di '+dx+', '+dy+' px'); }

/* ---- Modificatore di ambienti: cambia il materiale di erba, roccia e pietra lasciando forme e luci ---- */
const ENV_PRESETS={spaziale:{erba:['#5a3d00','#c08a00','#ffd23f','#fff3a6'],roccia:['#2a0f3d','#5b2a86','#9b59d6','#d7b8ff'],pietra:['#1a1f2b','#3d4a5c','#8fa0b8','#e6eef7']},
 ghiaccio:{erba:['#0b3d5c','#2b7fb0','#7fd6ff','#e8fbff'],roccia:['#1b2a3a','#3d5f7a','#8fb8d6','#e0f0ff'],pietra:['#222b36','#4d5d70','#a9bccf','#f5fbff']},
 fuoco:{erba:['#2b0a00','#7a1f00','#ff6a00','#ffd08a'],roccia:['#1a0f0a','#4a2a1a','#9a5a33','#e9b98a'],pietra:['#120a08','#3a2a22','#7a6a5a','#e8e0d8']}};
function envRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function envRampFromBase(hex){ const c=envRGB(hex); return [c.map(v=>v*0.3), c.map(v=>v*0.65), c, c.map(v=>v+(255-v)*0.5)]; }
function envRamp(st,t){ const n=st.length-1, x=Math.max(0,Math.min(1,t))*n, i=Math.min(n-1,Math.floor(x)), f=x-i; const a=st[i], b=st[i+1]; return [0,1,2].map(k=>a[k]+(b[k]-a[k])*f); }
function envHsl(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,sat=0; const dd=mx-mn;
  if(dd>0){ sat=l>0.5? dd/(2-mx-mn) : dd/(mx+mn); if(mx===r) h=((g-b)/dd+(g<b?6:0)); else if(mx===g) h=((b-r)/dd+2); else h=((r-g)/dd+4); h*=60; }
  return {h:h,s:sat,l:l}; }
function envGuess(c){ const q=envHsl(c[0],c[1],c[2]); if(q.s<0.22) return 'pietra'; if(q.h>=60&&q.h<=170) return 'erba'; if(q.h>=12&&q.h<60) return 'roccia'; if(q.h>=180&&q.h<=260) return 'pietra'; return 'altro'; }
function envKMeans(d,n,op,k){ const px=[]; for(let i=0;i<n;i++){ if(op[i]) px.push([d[i*4],d[i*4+1],d[i*4+2]]); } if(!px.length) return [];
  const samp=px.length>30000? px.filter((_,i)=>i%Math.ceil(px.length/30000)===0) : px;
  const srt=[...samp].sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
  let cen=[]; for(let j=0;j<k;j++) cen.push(srt[Math.floor((j+0.5)*srt.length/k)].slice());
  for(let it=0;it<12;it++){ const sum=cen.map(()=>[0,0,0,0]);
    for(const p of samp){ let best=0,bd=1e9; for(let j=0;j<cen.length;j++){ const c=cen[j], dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2; if(dd<bd){bd=dd;best=j;} } const q=sum[best]; q[0]+=p[0]; q[1]+=p[1]; q[2]+=p[2]; q[3]++; }
    cen=cen.map((c,j)=>sum[j][3]? [sum[j][0]/sum[j][3], sum[j][1]/sum[j][3], sum[j][2]/sum[j][3]] : c); }
  return cen; }
function envLabel(d,n,op,cen){ const lab=new Int16Array(n); for(let i=0;i<n;i++){ if(!op[i]){ lab[i]=-1; continue; } let best=0,bd=1e9; const r=d[i*4],g=d[i*4+1],b=d[i*4+2]; for(let j=0;j<cen.length;j++){ const c=cen[j], dd=(r-c[0])**2+(g-c[1])**2+(b-c[2])**2; if(dd<bd){bd=dd;best=j;} } lab[i]=best; } return lab; }
/* bordi puliti: ogni pixel prende la zona più frequente tra i suoi vicini visibili */
function envSmooth(lab,w,h,K){ const out=new Int16Array(lab.length), cnt=new Int32Array(K);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; if(lab[i]<0){ out[i]=-1; continue; } cnt.fill(0);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=w||yy>=h) continue; const v=lab[yy*w+xx]; if(v>=0) cnt[v]++; }
    let best=lab[i], bc=-1; for(let j=0;j<K;j++){ if(cnt[j]>bc){ bc=cnt[j]; best=j; } } out[i]=best; }
  return out; }
/* funzione del filtro: riceve i pixel della zona, li modifica in place, e legge i valori dei campi */
function envApply(d,w,h,v){ const n=w*h; const k=Math.max(3,Math.min(16,+v.zone||10));
  const src=(v.tema==='personalizzato')? {erba:envRampFromBase(v.erba),roccia:envRampFromBase(v.roccia),pietra:envRampFromBase(v.pietra)} : (ENV_PRESETS[v.tema]||ENV_PRESETS.spaziale);
  const R={}; for(const m of ['erba','roccia','pietra']){ R[m]=src[m].map(x=>Array.isArray(x)?x:envRGB(x)); }
  const lum=new Float32Array(n), op=new Uint8Array(n);
  for(let i=0;i<n;i++){ op[i]=d[i*4+3]>=128?1:0; lum[i]=(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255; }
  const cen=envKMeans(d,n,op,k); if(!cen.length) return;
  let lab=envLabel(d,n,op,cen); if(String(v.bordi)==='1') lab=envSmooth(lab,w,h,cen.length);
  const assign=cen.map(envGuess), ctr=(+v.luci||100)/100;
  for(let i=0;i<n;i++){ if(!op[i]) continue; const mat=assign[lab[i]]; if(mat==='altro'||!R[mat]) continue;
    const L=Math.max(0,Math.min(1,0.5+(lum[i]-0.5)*ctr)); const col=envRamp(R[mat],L); d[i*4]=col[0]; d[i*4+1]=col[1]; d[i*4+2]=col[2]; } }
function dlgEnvironment(){ liveAdjust('Modificatore di ambienti',[
  {k:'tema',label:'Tema',type:'select',options:[['spaziale','Spaziale'],['ghiaccio','Ghiaccio'],['fuoco','Fuoco'],['personalizzato','Personalizzato']],val:'spaziale'},
  {k:'zone',label:'Dettaglio (zone)',type:'range',min:3,max:16,val:10},

  {k:'bordi',label:'Bordi puliti',type:'select',options:[['1','Sì'],['0','No']],val:'1'}
 ],envApply,{note:'Trasforma erba, roccia e pietra nel tema scelto. Forme e luci restano quelle originali. Con "Personalizzato" usa i tre colori base. Si applica alla selezione, o a tutto il livello.'}); }
/* ---- Importa con maschera: porta un'immagine alla dimensione della tela, la ritaglia sulla silhouette del disegno e riduce i colori ---- */
let IMP={img:null,mask:null};
function impMask(){ const w=S.doc.w,h=S.doc.h,flat=flatten(); const c=mkC(w,h), x=c.getContext('2d'); x.drawImage(flat,0,0); const d=x.getImageData(0,0,w,h).data; const m=new Uint8Array(w*h); for(let i=0;i<m.length;i++) m[i]=d[i*4+3]>=128?1:0; return m; }
function impCompute(k){ const w=S.doc.w,h=S.doc.h,n=w*h; const c=mkC(w,h), x=c.getContext('2d'); x.imageSmoothingEnabled=true; x.drawImage(IMP.img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data; const op=new Uint8Array(n); for(let i=0;i<n;i++) op[i]=(IMP.mask[i]&&d[i*4+3]>=128)?1:0;
  const cen=envKMeans(d,n,op,k); if(!cen.length) return null; const lab=envLabel(d,n,op,cen);
  const out=new ImageData(w,h), od=out.data;
  for(let i=0;i<n;i++){ if(lab[i]<0) continue; const col=cen[lab[i]]; od[i*4]=col[0]; od[i*4+1]=col[1]; od[i*4+2]=col[2]; od[i*4+3]=255; }
  return out; }

    '<div style="font-size:12px;color:#9fb36a;margin-bottom:10px;line-height:1.5">Carica un\'immagine (per esempio quella di Gemini). Viene portata alla dimensione della tela, ritagliata sulla silhouette del disegno attuale e ridotta al numero di colori scelto. Il risultato diventa un nuovo livello.</div>'+
    '<label style="display:block;margin:6px 0">Immagine<br><input id="impFile" type="file" accept="image/png,image/jpeg"></label>'+
    '<label style="display:block;margin:10px 0">Colori: <span id="impKv">32</span><br><input id="impK" type="range" min="4" max="64" value="32" style="width:100%"></label>'+
    '<canvas id="impPrev" width="8" height="8" style="width:100%;max-width:400px;image-rendering:pixelated;border:1px solid #2a3a1a;background:#070b07;display:block;margin:8px 0"></canvas>'+
    '<div id="impMsg" style="min-height:18px;margin:6px 0;color:#9fb36a"></div>'+
    '<div style="text-align:right"><button id="impCancel" style="'+btnCss+'margin-right:6px">Annulla</button><button id="impGo" style="'+btnCss+'background:#c6e83a;color:#0f1218;font-weight:700" disabled>Applica</button></div>';
  ov.appendChild(card); document.body.appendChild(ov);
  const fEl=document.getElementById('impFile'), kEl=document.getElementById('impK'), kv=document.getElementById('impKv'), prev=document.getElementById('impPrev'), msg=document.getElementById('impMsg'), go=document.getElementById('impGo');
  const close=()=>ov.remove();

  const refresh=()=>{ if(!IMP.img) return; kv.textContent=kEl.value; const out=impCompute(+kEl.value); if(!out){ msg.textContent='Nessun pixel visibile nella silhouette.'; return; }
    prev.width=S.doc.w; prev.height=S.doc.h; prev.getContext('2d').putImageData(out,0,0); msg.style.color='#9fb36a';
    msg.textContent='Pronto: '+S.doc.w+'×'+S.doc.h+' px, '+kEl.value+' colori massimi. Premi Applica.'; go.disabled=false; };
  fEl.onchange=()=>{ const f=fEl.files[0]; if(!f) return; const im=new Image(); im.onload=()=>{ IMP.img=im; refresh(); }; im.onerror=()=>{ msg.style.color='#ffb3ab'; msg.textContent='Immagine non leggibile.'; }; im.src=URL.createObjectURL(f); };
  kEl.oninput=refresh;

    layerOp(()=>{ const L=addLayerTo(S.doc,'Importato con maschera',null); ctxOf(L).drawImage(c,0,0); },'Importa con maschera'); close(); status('Immagine importata con maschera come nuovo livello'); };

/* ---- Wizard Gemini: guida in cinque passi (base, prompt, risultato, sistemazione, inserimento). Gemini si usa nella sua chat, nel browser ---- */
let W={step:1,theme:'spaziale',style:'pixel',desc:'',img:null,k:32,smooth:true,contrast:100,bright:0,sat:100,hue:0,gamma:100,remap:{},pal:[],prev:null,type:'tileset',bgW:1920,bgH:400,tileBg:true,baseImg:null,cut:true,cutTol:40,cutMode:'auto',cutColor:'#ff00ff',seamMode:'patch',seamBand:15,seamBlend:0,spC:4,spR:3,spCw:64,spCh:64,spFrames:'',spPose:[],spCust:[],alignCells:false,tplBg:'none',refInTpl:false,bbPose:null,spChar:'',key:'nessuno',keyColor:'#ff00ff',grow:0,feather:0,keepCenter:true,imgId:0,baseId:0,cache:{}};
const WZ_STYLES={pixel:'Stile pixel art, palette limitata',fumetto:'Stile fumetto, con contorni neri marcati, colori piatti e ombre a tratteggio',cartoon:'Stile cartoon, colori vivi con ombre nette a due toni',acquerello:'Stile acquerello, colori tenui e sfumati, contorni morbidi',realistico:'Stile realistico, con luci naturali, texture dettagliate e colori naturali',retro:'Stile retro 8-bit, pochissimi colori saturi e pixel molto marcati'};
const WZ_STYLE_NOTE={pixel:'Consigliato: si riduce bene.',fumetto:'Consigliato: si riduce bene.',cartoon:'Si riduce bene.',acquerello:'Più dettagli: serve più colori (da 32 a 64).',realistico:'Molti dettagli: si riduce peggio alla pixel art; serve un numero di colori alto.',retro:'Si riduce benissimo.'};
const WZ_THEMES={spaziale:'ambientazione spaziale con pianeti, stelle, nebulose, metalli e luci fredde',lava:'ambientazione di lava e roccia vulcanica, con crepe incandescenti e pietra scura',ghiaccio:'ambientazione di ghiaccio e pietra innevata, con cristalli azzurri',libero:''};
function wzSetKey(key){ W.key=key; const map={magenta:'#ff00ff',verde:'#00ff00',blu:'#0000ff'};
  if(key==='nessuno'){ W.cutMode='auto'; W.cut=(W.type!=='sfondo'); }
  else { if(map[key]) W.keyColor=map[key]; W.cut=true; W.cutMode='colore'; W.cutColor=W.keyColor; W.cutTol=60; } }
function wzKeyName(){ const m={magenta:'magenta #FF00FF',verde:'verde #00FF00',blu:'blu #0000FF'}; return m[W.key]||String(W.keyColor).toUpperCase(); }

function trStr(t){ if(PM_LANG!=='en'||t==null) return t; const s=String(t); const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/); const core=m[2]; if(!core) return s;
